    var l=document.createElement('span');l.className='lv';l.textContent='LV '+c.lv;
    inner.appendChild(h);inner.appendChild(n);inner.appendChild(r);inner.appendChild(l);
    if(ED){var ct=document.createElement('div');ct.className='ctl';
      [['←',-1],['→',1],['✕',0]].forEach(function(a){var b=document.createElement('button');b.textContent=a[0];b.onclick=function(e){e.stopPropagation();
        if(a[1]===0){if(D.chars.length>1&&confirm('ลบ '+c.n+' ?')){D.chars.splice(i,1);renderTeam()}}
        else{var j=i+a[1];if(j>=0&&j<D.chars.length){D.chars.splice(j,0,D.chars.splice(i,1)[0]);renderTeam()}}};ct.appendChild(b)});inner.appendChild(ct)}
    d.appendChild(inner);d.onclick=function(){openD(i)};t.appendChild(d);
  });
  if(ED){var a=document.createElement('div');a.className='add';a.textContent='+ เพิ่มตัวละคร';a.onclick=function(){D.chars.push({n:'NEW',r:'ROLE',lv:1,e:'😎',q:'ประโยคเด็ดของคุณ',bio:'แนะนำตัวที่นี่',st:[['HACK',50],['COMBAT',50],['TECH',50],['LUCK',50]],tags:'tag1, tag2',link:''});renderTeam();openD(D.chars.length-1)};t.appendChild(a)}
}
/* ---------- dialog ---------- */
function setT(id,v,key){var e=$(id);e.textContent=v==null?'':v;if(ED){e.contentEditable='true';e.oninput=function(){var c=D.chars[cur];c[key]=key==='lv'?(parseInt(e.innerText.replace(/\D/g,''),10)||1):e.innerText;if(key==='n'||key==='r'||key==='lv')renderTeam()}}else e.removeAttribute('contenteditable')}
function openD(i){
  cur=(i+D.chars.length)%D.chars.length;var c=D.chars[cur];
  $('dAv').innerHTML=av(c);setT('dN',c.n,'n');setT('dR',c.r,'r');
  var L=$('dL');L.textContent=c.lv;L.style.cssText='';L.textContent='';var sp=document.createElement('span');sp.textContent='LV ';L.appendChild(sp);var lv=document.createElement('span');lv.id='dLv';lv.textContent=c.lv;L.appendChild(lv);
  if(ED){lv.contentEditable='true';lv.oninput=function(){c.lv=parseInt(lv.innerText.replace(/\D/g,''),10)||1;renderTeam()}}
  setT('dQ',c.q,'q');setT('dB',c.bio,'bio');
  var st=$('dSt');st.innerHTML='';
  c.st.forEach(function(s,k){
    var r=document.createElement('div');r.className='sr';
    var lb=document.createElement('span');lb.textContent=s[0];
    var bar=document.createElement('div');bar.className='bar';var f=document.createElement('i');bar.appendChild(f);
    var v;if(ED){v=document.createElement('input');v.type='number';v.min=0;v.max=100;v.value=s[1];v.oninput=function(){s[1]=Math.max(0,Math.min(100,+v.value||0));f.style.width=s[1]+'%'};lb.contentEditable='true';lb.oninput=function(){s[0]=lb.innerText}}
    else{v=document.createElement('span');v.textContent=s[1]}
    r.appendChild(lb);r.appendChild(bar);r.appendChild(v);st.appendChild(r);
    setTimeout(function(){f.style.width=s[1]+'%'},60+k*90);
  });
  var tg=$('dTg');tg.innerHTML='';(c.tags||'').split(',').map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){var s=document.createElement('span');s.textContent=x;tg.appendChild(s)});
  var lk=$('dLk');if(okU(c.link)){lk.href=c.link;lk.style.display='inline-block'}else lk.style.display='none';
  $('eE').value=c.e||'';$('eT').value=c.tags||'';$('eL').value=c.link||'';
  $('dI').textContent=(cur+1)+' / '+D.chars.length;
  $('dlg').style.display='flex';
}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}
$('eE').oninput=function(){var c=D.chars[cur];c.e=$('eE').value;c.img='';$('dAv').innerHTML=av(c);renderTeam()};
$('eT').oninput=function(){D.chars[cur].tags=$('eT').value;openKeep()};
$('eL').oninput=function(){D.chars[cur].link=$('eL').value.trim();var lk=$('dLk');if(okU(D.chars[cur].link)){lk.href=D.chars[cur].link;lk.style.display='inline-block'}else lk.style.display='none'};
$('eF').onchange=function(){var f=this.files[0];if(f)shrink(f,function(u){D.chars[cur].img=u;$('dAv').innerHTML=av(D.chars[cur]);renderTeam()})};
function openKeep(){var tg=$('dTg');tg.innerHTML='';(D.chars[cur].tags||'').split(',').map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){var s=document.createElement('span');s.textContent=x;tg.appendChild(s)})}
$('dx').onclick=function(){$('dlg').style.display='none'};
$('dlg').addEventListener('click',function(e){if(e.target===this)this.style.display='none'});
$('dP').onclick=function(){openD(cur-1)};$('dNx').onclick=function(){openD(cur+1)};
/* ---------- start ---------- */
function showApp(){$('boot').style.display='none';$('app').style.display='block';scrollTo(0,0);renderTeam()}
function enter(){
  if(ED)return;
  var w=document.createElement('div');w.style.cssText='position:fixed;inset:0;z-index:95;background:#05030f';
  var l=document.createElement('i');l.style.cssText='position:absolute;left:0;right:0;top:50%;height:3px;background:#fff;box-shadow:0 0 24px 6px #00f0ff';w.appendChild(l);document.body.appendChild(w);
  try{w.animate([{clipPath:'inset(49.5% 0 49.5% 0)',opacity:1},{clipPath:'inset(0 0 0 0)',opacity:1,offset:.45},{opacity:0}],{duration:1100,easing:'ease-in-out'}).onfinish=function(){w.remove()}}catch(e){w.remove()}
  setTimeout(showApp,520);
}
$('go').onclick=enter;
/* ---------- tap effects (inspired by gacha-game UI) ---------- */
function P(x,y){
  function mk(css){var e=document.createElement('i');e.style.cssText='position:fixed;z-index:90;pointer-events:none;left:'+x+'px;top:'+y+'px;'+css;document.body.appendChild(e);return e}
  function go(e,kf,d,dl,ez){try{e.animate(kf,{duration:d,delay:dl||0,easing:ez||'cubic-bezier(.2,.7,.2,1)',fill:'both'}).onfinish=function(){e.remove()}}catch(_){e.remove()}}
  return{mk:mk,go:go,R:function(a,b){return a+Math.random()*(b-a)}};
}
var C='translate(-50%,-50%)',STAR='polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)';
function star(h,s,col,rot,d,dl,dx,dy){
  h.go(h.mk('width:'+s+'px;height:'+s+'px;background:'+col+';clip-path:'+STAR+';filter:drop-shadow(0 0 5px '+col+')'),
    [{transform:C+' translate(0,0) scale(.2) rotate(0deg)',opacity:1},{transform:C+' translate('+(dx||0)*.5+'px,'+(dy||0)*.5+'px) scale(1) rotate('+rot+'deg)',opacity:1,offset:.4},{transform:C+' translate('+(dx||0)+'px,'+(dy||0)+'px) scale(.1) rotate('+rot*2+'deg)',opacity:0}],d,dl);
}
var FX={
  gi:function(x,y){var h=P(x,y),el=['#ff6a4a','#4aa3ff','#5fe3c0','#b07cff','#8bd450','#8fe8ff','#ffd24a'],i,a,d;
    star(h,48,'#ffeaa8',90,760,0);
    h.go(h.mk('width:64px;height:64px;border-radius:50%;border:2px solid #ffe9a8;box-shadow:0 0 16px #ffd24a,inset 0 0 12px #ffd24a'),[{transform:C+' scale(.2)',opacity:1},{transform:C+' scale(1.8)',opacity:0}],720);
    for(i=0;i<7;i++){a=Math.PI*2*i/7-Math.PI/2;d=h.R(46,72);
      h.go(h.mk('width:12px;height:12px;border-radius:50%;background:radial-gradient(#fff 15%,'+el[i]+' 70%);box-shadow:0 0 12px 3px '+el[i]),
        [{transform:C+' translate(0,0) scale(.4)',opacity:1},{transform:C+' translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) scale(1)',opacity:1,offset:.5},{transform:C+' translate('+Math.cos(a)*d*1.3+'px,'+(Math.sin(a)*d*1.3-24)+'px) scale(.2)',opacity:0}],950,i*28)}
    for(i=0;i<6;i++)star(h,h.R(8,14),'#fff3c4',200,h.R(800,1200),h.R(0,260),h.R(-60,60),-h.R(30,90));
  },
  hsr:function(x,y){var h=P(x,y),i,fr=[],t,A=-28*Math.PI/180;
    h.go(h.mk('width:2px;height:110px;background:linear-gradient(transparent,#fff,transparent);box-shadow:0 0 10px #c9b6ff'),[{transform:C+' scaleY(0)',opacity:1},{transform:C+' scaleY(1)',opacity:1,offset:.3},{transform:C+' scaleY(.1)',opacity:0}],650);
    h.go(h.mk('height:2px;width:110px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 10px #c9b6ff'),[{transform:C+' scaleX(0)',opacity:1},{transform:C+' scaleX(1)',opacity:1,offset:.3},{transform:C+' scaleX(.1)',opacity:0}],650);
    star(h,36,'#fff',45,720,0);
    [[70,0],[124,150]].forEach(function(r){h.go(h.mk('width:'+r[0]+'px;height:'+r[0]+'px;border-radius:50%;border:1.5px solid rgba(196,176,255,.95);box-shadow:0 0 12px #8b6bff'),[{transform:C+' scale(.2)',opacity:1},{transform:C+' scale(1)',opacity:0}],900,r[1])});
    h.go(h.mk('width:136px;height:48px;border-radius:50%;border:1px solid rgba(255,226,150,.95);box-shadow:0 0 10px rgba(255,210,100,.8)'),[{transform:C+' rotate(-28deg) scale(.2)',opacity:0},{transform:C+' rotate(-28deg) scale(1)',opacity:1,offset:.3},{transform:C+' rotate(-28deg) scale(1.12)',opacity:0}],1100);
    for(t=0;t<=12;t++){var q=Math.PI*2*t/12,ex=68*Math.cos(q),ey=24*Math.sin(q);fr.push({transform:C+' translate('+(ex*Math.cos(A)-ey*Math.sin(A)).toFixed(1)+'px,'+(ex*Math.sin(A)+ey*Math.cos(A)).toFixed(1)+'px)',opacity:t===0||t===12?0:1})}
    h.go(h.mk('width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px #ffd98a'),fr,1100,0,'linear');
    for(i=0;i<6;i++)star(h,h.R(7,12),i%2?'#d9ccff':'#ffe9a8',160,h.R(900,1300),h.R(0,300),h.R(-70,70),-h.R(40,100));
  },
  neon:function(x,y){var h=P(x,y),i,c,a,d,CC=['#00c4ff','#ff1aa8','#7a2cff'];
    CC.forEach(function(k,j){h.go(h.mk('width:'+(70+j*50)+'px;height:'+(70+j*50)+'px;border:3px solid '+k+';box-shadow:0 0 14px 2px '+k+',inset 0 0 10px '+k),[{transform:C+' rotate(45deg) scale(.1)',opacity:1},{transform:C+' rotate(45deg) scale(1)',opacity:0}],850,j*110)});
    h.go(h.mk('width:14px;height:14px;border-radius:50%;background:radial-gradient(#fff 25%,#00c4ff 70%);box-shadow:0 0 20px 8px #00c4ff'),[{transform:C+' scale(1)',opacity:1},{transform:C+' scale(3)',opacity:0}],450);
    for(i=0;i<16;i++){a=Math.PI*2*i/16;d=h.R(50,110);c=CC[i%3];h.go(h.mk('width:16px;height:3px;border-radius:2px;background:'+c+';box-shadow:0 0 10px 1px '+c),[{transform:C+' rotate('+a+'rad) translateX(10px) scaleX(.3)',opacity:1},{transform:C+' rotate('+a+'rad) translateX('+d+'px) scaleX(1.4)',opacity:0}],h.R(500,800))}
  }
};
var MODES=['rand','gi','hsr','neon','off'],LBL={rand:'FX: RANDOM',gi:'FX: ELEMENT',hsr:'FX: STELLAR',neon:'FX: NEON',off:'FX: OFF'};
function fxMode(){return D.fx||'rand'}
function fire(x,y,m){m=m||fxMode();if(m==='off')return;if(m==='rand')m=['gi','hsr','neon'][Math.floor(Math.random()*3)];FX[m]&&FX[m](x,y)}
document.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('input,textarea,[contenteditable=true],#ibar,#fxb'))return;
  fire(e.clientX,e.clientY);
});
var lastT=0;
document.addEventListener('pointermove',function(e){
  if(!(e.buttons||e.pointerType==='touch'))return;var n=Date.now();if(n-lastT<50)return;lastT=n;
  var m=fxMode();if(m==='off')return;if(e.target.closest&&e.target.closest('input,#ibar'))return;
  var col=m==='gi'?'#ffd98a':m==='hsr'?'#cbbcff':Math.random()<.5?'#00f0ff':'#ff2bd6',d=document.createElement('i');
  d.style.cssText='position:fixed;z-index:90;pointer-events:none;width:6px;height:6px;border-radius:50%;left:'+e.clientX+'px;top:'+e.clientY+'px;background:'+col+';box-shadow:0 0 10px 2px '+col;document.body.appendChild(d);
  try{d.animate([{transform:C+' scale(1)',opacity:.9},{transform:C+' scale(.2)',opacity:0}],{duration:550}).onfinish=function(){d.remove()}}catch(_){d.remove()}
});
function syncFx(){$('fxb').textContent=LBL[fxMode()]}
$('fxb').onclick=function(e){e.stopPropagation();var i=(MODES.indexOf(fxMode())+1)%MODES.length;D.fx=MODES[i];syncFx();var r=this.getBoundingClientRect();if(D.fx!=='off')fire(r.left+r.width/2,r.top-46,D.fx==='rand'?'gi':D.fx)};
/* ---------- load / save ---------- */
function load(){
  return fetch(SB+'/rest/v1/site2?id=eq.1&select=data',{headers:{apikey:SK}}).then(function(r){return r.ok?r.json():[]}).then(function(j){var d=j&&j[0]&&j[0].data;if(d&&d.chars&&d.chars.length)return d;throw 0}).catch(function(){try{var l=localStorage.getItem('cyber');return l?JSON.parse(l):null}catch(e){return null}});
}
function local(){try{localStorage.setItem('cyber',JSON.stringify(D))}catch(e){}}
function save(){
  var pw=$('pw').value;if(!pw){toast('ใส่รหัสแก้ไขก่อนกดบันทึก');return}
  if(JSON.stringify(D).length>3000000){toast('รูปรวมกันใหญ่เกินไป ลองลดจำนวนรูป');return}
  toast('กำลังบันทึก...');
  fetch(SB+'/rest/v1/rpc/save_site2',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({pw:pw,new_data:D})}).then(function(r){
    if(r.ok){local();toast('บันทึกขึ้นเว็บแล้ว ✓');return}
    return r.text().then(function(x){if(/wrong password/.test(x)){toast('รหัสผิด ลองใหม่อีกครั้ง');return}local();toast('ยังไม่ได้ตั้งค่าฐานข้อมูล จึงบันทึกไว้ในเครื่องนี้เท่านั้น')})
  }).catch(function(){local();toast('ออฟไลน์ บันทึกไว้ในเครื่องนี้เท่านั้น')});
}
$('sv').onclick=save;
$('ap').onclick=function(){showApp()};
$('ex').onclick=function(){location.hash='';location.reload()};
var lt=0,lc=0;$('logo').onclick=function(){var n=Date.now();lc=(n-lt<1500)?lc+1:1;lt=n;if(lc>=5&&!ED){location.hash='#edit';location.reload()}};
/* ---------- init ---------- */
function start(d){
  if(d)D=Object.assign({},DEF,d);
  if(ED){document.body.classList.add('ed');$('ibar').style.display='flex'}
  fill();bind();syncFx();typeLog();
  if($('app').style.display==='block')renderTeam();
}
start(null);
load().then(function(d){if(d){start(d)}});
})();
